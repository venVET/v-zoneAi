<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#050912">
<title>V TRADE AI — Secure Sign In</title>
<style>
:root{--bg:#04070d;--line:#233552;--text:#f5f8ff;--muted:#8d9bb0;--v:#7136e8;--g:#22e58a;--r:#ff5968;--c:#35d8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#281450,transparent 32%),radial-gradient(circle at 90% 5%,#073c43,transparent 30%),var(--bg);color:var(--text);font:14px "Noto Sans Khmer","Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center;padding:12px}.box{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:#07101cf5;box-shadow:0 30px 90px #000b}
.logo{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:28px;font-weight:950;background:linear-gradient(135deg,#5120ff,#aa72ff);margin-bottom:18px}
.muted{color:var(--muted);line-height:1.6}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.roles button,.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#09111e;color:#fff;font-weight:800}
.roles .active{background:#28105e;border-color:#8050ff}.field{display:grid;gap:7px;margin:14px 0}
.field input{height:48px;border:1px solid var(--line);border-radius:12px;background:#eef3ff;color:#101522;padding:0 13px;outline:none;width:100%}
.btn{width:100%;background:linear-gradient(135deg,#5421cf,#7136e8);border-color:#8050ff;cursor:pointer}.btn:disabled{opacity:.6}
.msg{min-height:22px;margin-top:13px;color:var(--r);font-size:12px}.backend{margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px}
.ok{border-color:#147850;background:#062d20;color:#9fffd0}.bad{border-color:#7c2532;background:#2b0c13;color:#ff9aa6}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px}.links a{color:var(--c);text-decoration:none}
@media(max-width:520px){.box{padding:22px;border-radius:18px}}
</style>
</head>
<body>
<main class="box">
<div class="logo">V</div><h1>V TRADE AI</h1>
<div class="muted">Secure ICT Smart Terminal access. Server verifies the real account role.</div>
<div class="roles"><button id="userMode" type="button" class="active">👤 User</button><button id="adminMode" type="button">👑 Admin</button></div>
<form id="form">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn" id="submit" type="submit">🔐 Sign in as User</button>
</form>
<div id="twofa" hidden><div class="field"><label for="code">2FA code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="btn" id="verify" type="button">Verify & Continue</button></div>
<div id="msg" class="msg"></div><div id="backend" class="backend">Checking Render backend…</div>
<div class="links"><a href="/">← Home</a></div>
</main>
<script>
const API=window.location.origin;
const ROUTE_VERSION='20260828-ui-fix-v1';
const $=id=>document.getElementById(id);
let role='user',challenge='';
function setRole(r){role=r;$('userMode').classList.toggle('active',r==='user');$('adminMode').classList.toggle('active',r==='admin');$('submit').textContent=r==='admin'?'👑 Sign in as Admin':'🔐 Sign in as User';}
function say(text,ok=false){$('msg').textContent=text;$('msg').style.color=ok?'#22e58a':'#ff5968';}
async function api(path,options={}){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(API+path,{...options,credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});
    const text=await response.text();let data={};try{data=text?JSON.parse(text):{};}catch{data={error:text||`HTTP ${response.status}`};}
    if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);
    return data;
  }catch(error){
    if(error?.name==='AbortError')throw new Error('Render backend timeout.');
    throw error;
  }finally{clearTimeout(timer);}
}
function routeByRole(user){
  const r=String(user?.role||'user').trim().toLowerCase();
  if(r==='admin'||r==='administrator')return 'admin-dashboard.html?v='+ROUTE_VERSION;
  return 'premium-dashboard-live.html?v='+ROUTE_VERSION;
}
function save(data){
  if(!data?.token)throw new Error('Authentication token was not returned.');
  const token=String(data.token),user=data.user||{};
  localStorage.setItem('vtrade_auth_token',token);localStorage.setItem('vtrade_auth',token);localStorage.setItem('vtrade_user',JSON.stringify(user));
  sessionStorage.setItem('vtrade_auth_token',token);sessionStorage.setItem('vtrade_auth',token);sessionStorage.setItem('vtrade_user',JSON.stringify(user));
  location.replace(routeByRole(user));
}
async function login(e){
  e.preventDefault();$('submit').disabled=true;say('Signing in…',true);
  try{
    const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
    if(data.requires2FA){challenge=data.challenge;$('form').hidden=true;$('twofa').hidden=false;say('2FA code required.',true);return;}
    const r=String(data.user?.role||data.role||'user').toLowerCase();
    if(role==='admin'&&!['admin','administrator'].includes(r))throw new Error('This account is not an administrator.');
    if(role==='user'&&['admin','administrator'].includes(r))throw new Error('Admin account detected. Please choose Admin.');
    save(data);
  }catch(error){say(error.message||'Login failed.');}finally{$('submit').disabled=false;}
}
$('userMode').onclick=()=>setRole('user');$('adminMode').onclick=()=>setRole('admin');$('form').onsubmit=login;
$('verify').onclick=async()=>{try{const data=await api('/api/auth/2fa/verify',{method:'POST',body:JSON.stringify({challenge,code:$('code').value.trim()})});save(data);}catch(error){say(error.message||'2FA verification failed.');}};
(async()=>{try{const response=await fetch(API+'/api/auth/health',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json().catch(()=>({}));$('backend').textContent=data?.success?'● Render backend connected':'● Render backend responded';$('backend').classList.add('ok');}catch(error){$('backend').textContent='● Render backend unavailable';$('backend').classList.add('bad');}})();
</script>
</body>
</html>
