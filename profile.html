<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>V TRADE AI — Profile</title><style>
body{margin:0;background:#04070d;color:#f5f8ff;font:14px "Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}.box{width:min(560px,100%);padding:24px;border:1px solid #233552;border-radius:18px;background:#07101c}.row{padding:12px 0;border-bottom:1px solid #17253a}.muted{color:#8d9bb0;font-size:11px}.btn{display:inline-block;margin-top:14px;padding:11px 14px;border-radius:10px;border:1px solid #233552;background:#0b1423;color:#fff;text-decoration:none;font-weight:800}.primary{background:#5421cf;border-color:#8050ff}
</style></head><body><main class="box"><h2>V TRADE AI — Profile</h2><div id="profile">Loading…</div><a class="btn primary" href="premium-dashboard-live.html">Live Terminal</a><a class="btn" href="admin-dashboard.html">Admin Dashboard</a></main><script src="vtrade-connection.js"></script><script src="vtrade-rbac-guard.js"></script><script>
const t=sessionStorage.getItem('vtrade_auth_token')||sessionStorage.getItem('vtrade_auth')||localStorage.getItem('vtrade_auth_token')||localStorage.getItem('vtrade_auth');fetch('https://v-trade-ai.onrender.com/api/auth/session',{cache:'no-store',headers:{'x-vtrade-auth':t||''}}).then(r=>r.json()).then(d=>{if(!d.user)throw Error('Session expired');const u=d.user;document.getElementById('profile').innerHTML='<div class="row"><b>Name</b><br>'+esc(u.name)+'</div><div class="row"><b>Email</b><br>'+esc(u.email)+'</div><div class="row"><b>Role</b><br>'+esc(u.role)+'</div><div class="row"><b>Plan</b><br>'+esc(u.plan)+'</div>'}).catch(()=>location.replace('login.html?required=login&reason=session_expired'));function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]) )}
</script></body></html>
